#logistica-demo{--paper:light-dark(#ffffff,#192523);--base:light-dark(#eef3f0,#101917);--ink:light-dark(#183b32,#e0eee8);--line:light-dark(#d9e4dd,#35453f);--soft:light-dark(#5d7269,#a5b9ae);--brand:light-dark(#146448,#72d4aa);font:14px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--base);border-radius:18px;overflow:hidden}#logistica-demo *{box-sizing:border-box}#logistica-demo header{background:var(--paper);padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}#logistica-demo h2,#logistica-demo h3,#logistica-demo p{margin:0}#logistica-demo small{color:var(--soft)}#logistica-demo .ld-layout{display:grid;grid-template-columns:210px 1fr}#logistica-demo aside{padding:20px 14px;background:var(--paper);border-right:1px solid var(--line)}#logistica-demo button,#logistica-demo input,#logistica-demo select,#logistica-demo textarea{font:inherit;color:inherit}#logistica-demo button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 14px;cursor:pointer}#logistica-demo button:disabled{opacity:.45;cursor:default}#logistica-demo button.active,#logistica-demo .ld-main{background:var(--brand);color:light-dark(#fff,#0e2a20);border-color:transparent}#logistica-demo aside button{display:block;text-align:left;width:100%;margin-bottom:8px}#logistica-demo main{padding:24px;min-width:0}#logistica-demo .ld-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#logistica-demo .ld-between{justify-content:space-between}#logistica-demo .ld-stack{display:grid;gap:12px}#logistica-demo .ld-box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}#logistica-demo .ld-meta{color:var(--soft);font-size:12px}#logistica-demo .ld-tag{display:inline-block;background:var(--base);border-radius:6px;padding:3px 8px;font-size:12px}#logistica-demo label{display:grid;gap:5px}#logistica-demo input:not([type=checkbox]),#logistica-demo select,#logistica-demo textarea{background:var(--paper);border:1px solid var(--line);padding:10px;border-radius:8px;max-width:100%;width:100%}#logistica-demo input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand)}#logistica-demo .ld-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}#logistica-demo .ld-check{display:flex;align-items:center;gap:10px}#logistica-demo .ld-space{margin-top:14px}#logistica-demo img,#logistica-demo video{max-width:100%;max-height:220px;border-radius:10px;display:block;margin-top:10px}#logistica-demo audio{max-width:100%}#logistica-demo .ld-note{color:var(--brand);padding:12px 0;min-height:24px}#logistica-demo .ld-error{color:light-dark(#b83232,#ffaaa3)}#logistica-demo .ld-empty{padding:36px;text-align:center;color:var(--soft)}#logistica-demo .ld-count{font-size:12px;color:var(--soft);margin-top:24px}#logistica-demo .ld-selected{border-color:var(--brand)}@media(max-width:650px){#logistica-demo .ld-layout{grid-template-columns:1fr}#logistica-demo aside{display:flex;gap:6px;flex-wrap:wrap;border-right:0;padding:10px}#logistica-demo aside button{width:auto;margin:0}#logistica-demo aside .ld-count{display:none}#logistica-demo main{padding:14px}#logistica-demo header{padding:16px}#logistica-demo .ld-grid{grid-template-columns:1fr}}

</style><header><div class="brand-heading"><img id="brand-logo" alt="Central de Pedidos" hidden><div><small>CENTRAL DE PEDIDOS</small><h2 id="who">Conectando…</h2></div></div><div id="switch"></div></header><div class="ld-layout"><aside id="nav"></aside><main><div id="view"></div><p id="notice" role="status" aria-live="polite"></p></main></div></div><dialog id="zoom"><button onclick="document.getElementById('zoom').close()">Fechar</button><div id="zoom-content"></div></dialog><script>
let editing=null;
let accessToken='',shop=null,data=null,tab='pedidos',busy=false,selection=new Set(),cache={},timer=null,audio=null;const $=s=>document.querySelector(s),esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mutationSnapshot=null;
async function rpc(name,...args){const response=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method:name,args:[{token:accessToken},...args.slice(1)]})});let result;try{result=await response.json();}catch{throw Error('Servidor indisponível. Tente novamente em instantes.');}if(!response.ok||!result.ok)throw Error(result.error||'Falha na conexão.');if(result.result?.snapshot)mutationSnapshot=result.result.snapshot;return result.result;}
function note(t){$('#notice').textContent=t;}
async function action(fn){if(busy)return;busy=true;mutationSnapshot=null;try{note('Salvando…');await fn();if(mutationSnapshot){data=mutationSnapshot;shop=data.user.shop;render();}else await load();note('Salvo.');}catch(e){note(e.message||String(e));}finally{busy=false;}}
async function load(){data=await rpc('snapshot',shop);shop=data.user.shop;render();}
function opts(xs){return xs.map(x=>'<option>'+esc(x)+'</option>').join('');}
const navIcons={"pedidos":"<path d=\"M4 9 13 4l9 5-9 5-9-5Zm0 0v12l8 5V14m1 12 4-1\"/><path d=\"m19 22 7-7 3 3-7 7-4 1 1-4Z\"/>","meus":"<path d=\"m3 8 9-4 9 4-9 5-9-5Zm0 0v13l8 5V13m4-8 6 3v5\"/><circle cx=\"22\" cy=\"21\" r=\"5\"/><path d=\"m26 25 4 4\"/>","separar":"<circle cx=\"8\" cy=\"5\" r=\"3\"/><path d=\"m3 16 2-6h6l5 7M7 11v10l-4 8m4-8 6 8M11 12l-1 5 7 2\"/><path d=\"M18 15h11v12H18zM23 15v4\"/>","retorno":"<circle cx=\"5\" cy=\"5\" r=\"3\"/><path d=\"M2 25 5 16l-2-5h5l4 6h4M5 16l6 12M17 12V6h9v15h-9m9-9h3l2 5v4h-5M11 9h5v5h-5\"/><circle cx=\"20\" cy=\"25\" r=\"2\"/><circle cx=\"28\" cy=\"25\" r=\"2\"/>","enquetes":"<circle cx=\"7\" cy=\"5\" r=\"3\"/><path d=\"M2 20v-8h10v8M5 20v9m5-9v9M18 8h11v20H17V8m3 0V5h6v3m-6 7 2 2 4-4m-6 9h6\"/>","ida":"<path d=\"M3 7h13v22H3V7m4 0V4h5v3M6 13l2 2 4-4M7 21h5M19 10h8l4 5v9H19m8-14v6h4\"/><circle cx=\"22\" cy=\"27\" r=\"2\"/><path d=\"m19 4 4 0m-2-2 2 2-2 2\"/>","saidas":"<path d=\"M8 7h14v16H8m14-12h5l4 6v6h-9m5-12v7h4M2 11h3M1 16h4M2 21h3\"/><circle cx=\"13\" cy=\"25\" r=\"3\"/><circle cx=\"26\" cy=\"25\" r=\"3\"/>","painel":"<path d=\"M5 4v24h24M10 22v-7m7 7V9m7 13V5\"/>","acessos":"<circle cx=\"11\" cy=\"12\" r=\"6\"/><path d=\"m16 16 12 12m-4-4 4-4m-8 0 4-4\"/>"};
function navIcon(id){return '<svg class="nav-icon" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+(navIcons[id]||navIcons.enquetes)+'</svg>';}
function allowedTabs(){return [['pedidos','Fazer pedido'],['meus','Meus pedidos'],['separar','Pedidos da loja para separar'],...(shop!=='Cupira 1'?[['retorno','Enviar pedidos']]:[]),['enquetes','Enquetes'],...(shop==='Cupira 1'?[['ida','Montar envio'],['saidas','Saídas registradas']]:[]),...(data.user.role==='master'?[['painel','Dashboard'],['problemas','Pendências de envio'],['acessos','Acessos'],['avisos','Configurar avisos']]:[])];}
function batchOrders(b){const orders=b.ids.map(id=>data.orders.find(o=>o.id===id));return '<details class="ld-box"><summary style="cursor:pointer;font-weight:700;padding:8px 0">Ver pedidos deste lote ('+b.ids.length+')</summary>'+orders.map(o=>o?'<article class="ld-box"><div class="order-route"><div>De: '+esc(o.origin)+'</div><div>Para: '+esc(o.dest)+'</div></div><p>Cliente: '+esc(o.client||'Reposição')+'</p><p>Telefone / WhatsApp: '+esc(o.phone||'Reposição')+'</p><small>Pedido em '+new Date(o.created).toLocaleString('pt-BR')+'</small><p>'+esc(o.title)+'</p>'+picture(o.photo)+'</article>':'<p>Pedido de outra loja: detalhes restritos ao acesso autorizado.</p>').join('')+'</details>';}
const mediaPending={};let thumbActive=0;const thumbQueue=[];
async function fetchMedia(id){if(cache[id])return cache[id];if(!mediaPending[id])mediaPending[id]=rpc('getMedia',shop,id).then(m=>{cache[id]=m;return m;}).finally(()=>delete mediaPending[id]);return mediaPending[id];}
function picture(m){return m.type.startsWith('video')?'<button type="button" data-media="'+esc(m.id)+'">Ver vídeo</button>':'<button type="button" class="photo-thumb" data-media="'+esc(m.id)+'" aria-label="Ampliar foto do pedido"><span>Carregando foto…</span><img data-thumb="'+esc(m.id)+'" alt="Foto do produto" hidden></button>';}
function runThumbs(){while(thumbActive<3&&thumbQueue.length){const img=thumbQueue.shift();if(!img.isConnected)continue;thumbActive++;fetchMedia(img.dataset.thumb).then(m=>{if(!img.isConnected)return;img.src='data:'+m.type+';base64,'+m.data;img.hidden=false;img.previousElementSibling.hidden=true;}).catch(()=>{if(img.isConnected)img.previousElementSibling.textContent='Foto indisponível — toque para tentar';}).finally(()=>{thumbActive--;runThumbs();});}}
const thumbObserver=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){thumbObserver.unobserve(e.target);thumbQueue.push(e.target.querySelector('img'));}});runThumbs();},{rootMargin:'150px'});
new MutationObserver(()=>document.querySelectorAll('img[data-thumb]:not([data-watched])').forEach(img=>{img.dataset.watched='1';thumbObserver.observe(img.parentElement);})).observe(document.getElementById('view'),{childList:true,subtree:true});
function notificationCard(o){if(o.status!=='Recebido'||o.kind==='Reposição'||o.dest!==shop)return '';const n=o.notification,labels={queued:'Na fila',sending:'Enviando',sent:'Avisado',uncertain:'Conferir envio'};return '<section class="ld-box"><strong>'+ (n?labels[n.status]:'Falta avisar')+'</strong>'+(n?'<p>'+esc(n.error|| (n.status==='sent'?'Envio confirmado pela API em '+new Date(n.finishedAt).toLocaleString('pt-BR'):'A fila continua mesmo com esta página fechada.'))+'</p>':'<p>'+esc(o.notificationIssue||'')+'</p><p>Enviar pelo WhatsApp da Central que o produto chegou à loja '+esc(o.dest)+'.</p><button data-notify="'+o.id+'">Avisar cliente</button>')+'</section>';}
function row(o,select=false){return '<article class="ld-box '+({'Pendente':'order-pending','Pronto para enviar':'order-ready','Em transporte':'order-transit','Retorno em transporte':'order-return','Recebido':'order-received'}[o.status]||'')+'"><div class="ld-row ld-between"><div class="order-route"><div>De: '+esc(o.origin)+'</div><div>Para: '+esc(o.dest)+'</div></div><span class="ld-tag '+(o.status==='Pendente'?'ld-status-pending':o.status==='Pronto para enviar'?'ld-status-ready':'')+'">'+esc(o.status==='Pendente'?'Não separado — verificar':o.status)+'</span></div><p>Telefone / WhatsApp: '+esc(o.phone||'Reposição')+'</p><p>Cliente: '+esc(o.client||'Reposição')+'</p>'+picture(o.photo)+'<p>'+esc(o.title)+'</p>'+(o.reason?'<p>Ficou: '+esc(o.reason)+'</p>':'')+(select?'<label class="ld-check"><input type="checkbox" data-select="'+o.id+'"> Vai neste lote</label><label>Motivo, se ficar<input data-reason="'+o.id+'"></label>':'')+(tab==='separar'&&o.status==='Pendente'?'<button data-separate="'+o.id+'">Marcar separado</button>':'')+(tab==='meus'&&o.status==='Em transporte'?'<button data-receive="'+o.id+'">Receber e avisar cliente</button>':'')+(tab==='meus'&&['Pendente','Pronto para enviar'].includes(o.status)&&!o.batch?'<button data-edit="'+o.id+'">Editar pedido</button>':'')+notificationCard(o)+'</article>';}
function receiptGroups(){const orders=data.orders.filter(o=>o.dest===shop&&o.status==='Em transporte');return [...new Set(orders.map(o=>o.batch||'sem-lote'))].map(id=>{const batch=data.batches.find(b=>b.id===id),items=orders.filter(o=>(o.batch||'sem-lote')===id);return '<section class="ld-box"><h3>Lote '+esc(id.slice(0,8))+'</h3><p>'+esc(batch?'Saída de '+batch.origin+' em '+new Date(batch.created).toLocaleString('pt-BR'):'Pedidos em transporte')+'</p><p>Marque somente o que chegou. Ao confirmar, os clientes com telefone válido serão avisados automaticamente; reposições não geram mensagem.</p><label class="ld-check"><input type="checkbox" data-receipt-all="'+esc(id)+'"> Selecionar todos deste lote</label>'+items.map(o=>'<label class="ld-check"><input type="checkbox" data-receipt="'+esc(id)+'" value="'+esc(o.id)+'"> Recebi: '+esc(o.client||'Reposição')+'</label>'+row(o)).join('')+'<button data-receipt-confirm="'+esc(id)+'" class="ld-main">Confirmar selecionados e avisar clientes</button></section>';}).join('');}
function render(){if(!data)return;if(data.iconUrl){$('#brand-logo').src='/icon.png';$('#brand-logo').hidden=false;}$('#who').textContent=shop||'Mestre';$('#switch').innerHTML=data.user.role==='master'?'<label>Entrar como loja<select id="as"><option value="">Mestre</option>'+data.shops.map(s=>'<option '+(s===shop?'selected':'')+'>'+esc(s)+'</option>').join('')+'</select></label>':'<small>Acesso salvo neste aparelho</small>';if(!shop&&!['painel','problemas','acessos','avisos'].includes(tab))tab='painel';$('#nav').innerHTML=allowedTabs().filter(x=>shop||['painel','problemas','acessos','avisos'].includes(x[0])).map(([id,t])=>'<button data-tab="'+id+'" class="'+(tab===id?'active':'')+'" aria-current="'+(tab===id?'page':'false')+'">'+navIcon(id)+'<span>'+t+'</span></button>').join('');const v=$('#view');
if(tab==='pedidos'){v.innerHTML='<h2>Fazer pedido</h2><form id="order" class="ld-compose"><label>De qual loja precisa do produto?<select name="origin" required><option value="" selected disabled>Escolha a loja fornecedora</option>'+opts(data.shops.filter(s=>s!==shop&&!(s.startsWith('Cupira')&&shop.startsWith('Cupira'))))+'</select></label><small>Destino automático: '+esc(shop)+'</small><div class="ld-row"><button type="button" data-pick="photo-camera">Câmera</button><button type="button" data-pick="photo-gallery">Galeria / prints</button></div><input hidden type="file" id="photo-camera" accept="image/*" capture="environment"><input hidden type="file" id="photo-gallery" accept="image/*"><div id="photo-preview"></div><label class="ld-check"><input type="checkbox" name="rep"> Reposição</label><label id="client-label">Nome do cliente<input name="client" required maxlength="100"></label><label id="phone-label">Telefone / WhatsApp<input name="phone" type="tel" required></label><label>Observação opcional<textarea name="title" maxlength="400"></textarea></label><button class="ld-main">Enviar pedido</button></form>';window.chosenPhoto=null;}
else if(tab==='meus'){const descriptions={'Pendente':'Ainda não foi separado pela loja fornecedora.','Pronto para enviar':'Já separado e aguardando envio.','Em transporte':'A caminho da sua loja. Confira abaixo os itens que chegaram.','Retorno em transporte':'A caminho da central para distribuição.','Recebido':'Já chegou à sua loja. Veja o andamento do aviso ao cliente.'};v.innerHTML='<h2>Meus pedidos</h2><button id="refresh-orders">Atualizar andamento</button>'+['Pendente','Pronto para enviar','Em transporte','Retorno em transporte','Recebido'].map(s=>'<h3 class="ld-space">'+s+'</h3><small>'+descriptions[s]+'</small>'+(s==='Em transporte'?receiptGroups():data.orders.filter(o=>o.dest===shop&&o.status===s).map(o=>row(o)).join(''))).join('');}
else if(tab==='separar'){v.innerHTML='<h2>Pedidos da loja para separar</h2>'+data.orders.filter(o=>o.origin===shop&&o.status==='Pendente').map(o=>row(o)).join('');}

function metrics(){
 $('#compare-controls').hidden=$('#period').value!=='compare';if($('#period').value==='compare'){$('#year-label').hidden=true;compareMetrics();return;}
 const mode=$('#period').value,now=new Date(),localDay=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
 const years=[...new Set([Number(localDay(now).slice(0,4)),...data.orders.map(o=>Number(localDay(new Date(o.created)).slice(0,4)))])].sort((a,b)=>b-a);
 if(!$('#chart-year').options.length)$('#chart-year').innerHTML=years.map(y=>'<option>'+y+'</option>').join('');
 $('#year-label').hidden=mode!=='year';const year=$('#chart-year').value;
 let keys=[],labels=[];
 if(mode==='30'){const today=localDay(now);for(let i=29;i>=0;i--){const d=new Date(today+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-i);const k=d.toISOString().slice(0,10);keys.push(k);labels.push(k.slice(8)+'/'+k.slice(5,7));}}
 else if(mode==='year'){for(let i=1;i<=12;i++){keys.push(year+'-'+String(i).padStart(2,'0'));labels.push(['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][i-1]);}}
 else{keys=[...new Set(data.orders.map(o=>localDay(new Date(o.created)).slice(0,7)))].sort();labels=keys.map(k=>k.slice(5)+'/'+k.slice(0,4));}
 const buckets=keys.map(()=>0);const os=data.orders.filter(o=>{const day=localDay(new Date(o.created)),key=mode==='30'?day:day.slice(0,7),i=keys.indexOf(key);if(i<0)return false;buckets[i]++;return true;});
 const max=Math.max(1,...buckets),peak=Math.max(0,...buckets),w=680,height=250,left=38,top=20,bottom=210,step=keys.length>1?(w-left-16)/(keys.length-1):0;
 const points=buckets.map((n,i)=>[left+i*step,bottom-n/max*(bottom-top)]);
 let svg='<svg viewBox="0 0 680 250" role="img" aria-label="Gráfico de pedidos por '+(mode==='30'?'dia':'mês')+'" style="width:100%;min-width:300px">';
 for(let i=0;i<=4;i++){const n=Math.ceil(max*i/4),y=bottom-n/max*(bottom-top);svg+='<path d="M38 '+y+'H664" stroke="#35453f"/><text x="30" y="'+(y+4)+'" text-anchor="end" fill="#a5b9ae" font-size="11">'+n+'</text>';}
 if(points.length)svg+='<polyline points="'+points.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="#72d4aa" stroke-width="3"/>';
 points.forEach((p,i)=>{svg+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#72d4aa"><title>'+esc(labels[i])+': '+buckets[i]+' pedidos</title></circle>';if(i%Math.max(1,Math.ceil(keys.length/8))===0||i===keys.length-1)svg+='<text x="'+p[0]+'" y="235" text-anchor="middle" fill="#a5b9ae" font-size="10">'+esc(labels[i])+'</text>';});svg+='</svg>';
 const clients={};os.filter(o=>o.phone).forEach(o=>{const key=o.phone.replace(/\D/g,'');clients[key]??={name:o.client,n:0};clients[key].n++;});
 $('#metrics').innerHTML='<div class="ld-box"><h2>'+os.length+' pedidos</h2><p>'+os.filter(o=>o.kind==='Reposição').length+' reposições · '+os.filter(o=>o.kind!=='Reposição').length+' pedidos de clientes</p></div><section class="ld-box"><h3>Evolução dos pedidos</h3><small>'+ (mode==='30'?'Total diário nos últimos 30 dias':mode==='year'?'Total mensal de '+year:'Total mensal de todo o histórico')+' · inclui reposições</small>'+svg+(peak?'<p>Maior volume: <strong>'+peak+'</strong> em '+esc(labels[buckets.indexOf(peak)])+'.</p>':'<p>Ainda não há pedidos neste período.</p>')+'<details><summary>Ver valores do gráfico</summary>'+keys.map((k,i)=>'<p>'+esc(labels[i])+': '+buckets[i]+'</p>').join('')+'</details></section><h3 class="ld-space">Clientes com mais pedidos</h3>'+Object.values(clients).sort((a,b)=>b.n-a.n).slice(0,10).map(c=>'<p>'+esc(c.name)+' · '+c.n+'</p>').join('');
}

function compareSeries(orders,start,end){
 const first=Date.parse(start+'T00:00:00Z'),last=Date.parse(end+'T00:00:00Z'),n=Math.round((last-first)/86400000)+1;
 if(!Number.isFinite(n)||n<1||n>366)throw Error('Escolha intervalos válidos de até 366 dias, com o fim após o início.');
 const vals=Array(n).fill(0),dates=vals.map((_,i)=>new Date(first+i*86400000).toISOString().slice(0,10));
 orders.forEach(o=>{const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(o.created));const i=dates.indexOf(parts);if(i>=0)vals[i]++;});
 return {vals,dates,total:vals.reduce((a,b)=>a+b,0)};
}
function compareMetrics(){
 const ids=['a-start','a-end','b-start','b-end'],nodes=ids.map(id=>$('#compare-'+id));
 if(!nodes[0].value){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');[new Date(y,m-1,1),new Date(y,m,0),new Date(y,m,1),now].forEach((d,i)=>nodes[i].value=fmt(d));}
 try{
 const a=compareSeries(data.orders,nodes[0].value,nodes[1].value),b=compareSeries(data.orders,nodes[2].value,nodes[3].value);
 const n=Math.max(a.vals.length,b.vals.length),max=Math.max(1,...a.vals,...b.vals),x=i=>42+(n===1?0:i*614/(n-1)),y=v=>210-v/max*180;
 const label=d=>d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4),range=s=>label(s.dates[0])+' a '+label(s.dates[s.dates.length-1]);
 let svg='<svg viewBox="0 0 680 255" role="img" aria-label="Comparação de pedidos por dia dos períodos A e B" style="width:100%">';
 for(let k=0;k<=4;k++){const v=Math.ceil(max*k/4);svg+='<path d="M42 '+y(v)+'H656" stroke="#35453f"/><text x="34" y="'+(y(v)+4)+'" fill="#a5b9ae" text-anchor="end" font-size="11">'+v+'</text>';}
 [[a,'#72d4aa','A'],[b,'#e5a4ff','B']].forEach(([s,color,name])=>{svg+='<polyline points="'+s.vals.map((v,i)=>x(i)+','+y(v)).join(' ')+'" fill="none" stroke="'+color+'" stroke-width="3"'+(name==='B'?' stroke-dasharray="7 4"':'')+'/>';s.vals.forEach((v,i)=>{svg+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3" fill="'+color+'"><title>'+name+' · '+label(s.dates[i])+': '+v+' pedidos</title></circle>';});});
 for(let i=0;i<n;i++){if(i%Math.max(1,Math.ceil(n/8))===0||i===n-1)svg+='<text x="'+x(i)+'" y="237" text-anchor="middle" fill="#a5b9ae" font-size="10">Dia '+(i+1)+'</text>';}svg+='</svg>';
 const diff=b.total-a.total,percent=a.total?((diff/a.total)*100).toFixed(1)+'%':b.total?'Sem percentual: período A tem zero pedidos':'0%';
 const today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
 $('#metrics').innerHTML='<div class="ld-grid"><section class="ld-box"><h3 style="color:#72d4aa">A · '+a.total+' pedidos</h3><p>'+range(a)+'</p><small>'+a.vals.length+' dias · média '+(a.total/a.vals.length).toFixed(1)+'/dia</small></section><section class="ld-box"><h3 style="color:#e5a4ff">B · '+b.total+' pedidos</h3><p>'+range(b)+'</p><small>'+b.vals.length+' dias · média '+(b.total/b.vals.length).toFixed(1)+'/dia</small></section></div><section class="ld-box"><h3>Comparação de pedidos</h3><p>B em relação a A: '+(diff>0?'+':'')+diff+' pedidos · '+percent+'</p><p><span style="color:#72d4aa">A — linha contínua</span> · <span style="color:#e5a4ff">B — linha tracejada</span></p>'+svg+'<small>Total de pedidos, incluindo reposições. Datas pelo horário de Brasília.</small>'+(a.vals.length!==b.vals.length?'<p>Os intervalos têm durações diferentes. Considere também a média diária.</p>':'')+(nodes[1].value>today||nodes[3].value>today?'<p>Há datas futuras: os totais desses intervalos ainda estão incompletos.</p>':'')+'<details><summary>Ver valores por dia</summary>'+Array.from({length:n},(_,i)=>'<p>Dia '+(i+1)+' · A: '+(i<a.vals.length?label(a.dates[i])+' — '+a.vals[i]:'fora do intervalo')+' · B: '+(i<b.vals.length?label(b.dates[i])+' — '+b.vals[i]:'fora do intervalo')+'</p>').join('')+'</details></section>';
 }catch(e){$('#metrics').textContent=e.message;}
}

async function pollVoice(){if(document.hidden||!shop)return;try{const fresh=await rpc('snapshot',shop);const pending=fresh.batches.filter(b=>b.origin!==shop&&b.recipients.includes(shop)&&!b.responses[shop]);const due=pending.filter(b=>!lastSpoken[b.id]||Date.now()-lastSpoken[b.id]>=300000);if(!due.length)return;const origins=[...new Set(due.map(b=>b.origin))];speechSynthesis.cancel();const voice=new SpeechSynthesisUtterance('Enquete de saída de '+origins.join(' e ')+' disponível no aplicativo. Por favor, confira e responda.');voice.lang='pt-BR';speechSynthesis.speak(voice);due.forEach(b=>lastSpoken[b.id]=Date.now());note('Há enquete aguardando sua resposta.');}catch(e){note(e.message);}}
